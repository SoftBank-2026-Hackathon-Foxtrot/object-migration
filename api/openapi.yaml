openapi: 3.1.0
info:
  title: Migration server common API
  version: 0.2.0
  description: |
    Object storage server of the team's common migration API. It follows
    common draft 0.2 where object storage fits: POST
    /v1/migrations/{id}/actions with QUIESCE, CUTOVER, RESUME, ROLLBACK,
    FINALIZE and CANCEL; GET /v1/operations/{id}; Bearer tokens;
    Idempotency-Key; expectedRevision; and the common lifecycle and health
    values. PREPARE, START_SYNC and RECONCILE are rejected with
    UNSUPPORTED_ACTION: POST /v1/migrations starts the initial copy at once,
    and the worker re-reads buckets and app routes after every restart.

    The server answers 202 at once and does the work in the background.
    Poll the operation's Location, or GET /v1/migrations/{id}.

    When the server runs with API_TOKEN set, every route except /healthz,
    .../routing and .../deletes needs Authorization: Bearer <token>. Apps
    call those two with no token.

    The older path commands (POST /v1/migrations/{id}/freeze and the rest)
    still work for existing tools.

    Cutover is split into freeze, switch, and resume so the orchestrator can
    line several servers up. Each server decides what each command means for
    its resource; for object storage, freeze does nothing.

    Field names in `phase`, `state`, `readiness`, `replication`,
    `allowedActions`, and error bodies are shared. `detail`, `source`,
    `target`, and `replication.initialCopy.unit` are server-specific.

paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /v1/capabilities:
    get:
      summary: What this server can migrate
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }

  /v1/preflight:
    post:
      summary: Check a migration request without changing anything
      description: >-
        Validates the request, then checks that the server can list the
        source and target and write the target. The write check puts a small
        object under `.object-migration/` in the target and deletes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointsRequest" }
      responses:
        "200":
          description: Check results. ok is false if any check failed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, checks]
                properties:
                  ok: { type: boolean }
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/Check" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/migrations:
    post:
      summary: Create a migration and start the initial sync
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointsRequest" }
      responses:
        "202":
          description: Created; the worker starts the initial sync
          headers:
            Location:
              schema: { type: string, example: /v1/migrations/om-1a2b3c4d5e6f7a8b }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    get:
      summary: Current state of a migration
      responses:
        "200":
          description: Migration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Abort a migration before switch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedVersion: { $ref: "#/components/schemas/ExpectedVersion" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/routing:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    get:
      summary: Where an app writes, reads and deletes now
      description: >-
        App servers ask about every second and report the generation they
        use, so a route change can wait for every live app. See
        docs/app-storage.md.
      parameters:
        - name: app
          in: query
          description: Name of the app server, unique among the app's servers.
          schema: { type: string }
        - name: applied
          in: query
          description: Route generation the app uses now; 0 before it has one.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Route. Endpoints carry no credentials.
          content:
            application/json:
              schema:
                type: object
                required: [migrationId, phase, generation, write, read, delete]
                properties:
                  migrationId: { type: string }
                  phase: { $ref: "#/components/schemas/Phase" }
                  generation: { type: integer }
                  write: { $ref: "#/components/schemas/RouteEndpoint" }
                  read:
                    type: array
                    description: In order; an object not found in one is looked up in the next.
                    items: { $ref: "#/components/schemas/RouteEndpoint" }
                  delete:
                    type: array
                    description: Every bucket that may hold a copy, in the order to delete from.
                    items: { $ref: "#/components/schemas/RouteEndpoint" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/deletes:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    post:
      summary: Record keys an app is about to delete
      description: >-
        While the route deletes from more than one bucket, an app records a
        key here before deleting it. Every copy the server makes afterwards
        removes its copy of a recorded key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              additionalProperties: false
              properties:
                keys:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, minLength: 1 }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    post:
      summary: Accept a common-API action
      description: |
        QUIESCE (READY) records the cutover attempt; object storage needs no
        pause, so apps keep writing. CUTOVER (QUIESCED) moves app reads to
        both buckets, then writes to the target, waiting for every app.
        RESUME (SWITCHED) stops forward copying and starts copying the
        target back. ROLLBACK (QUIESCED, SWITCHED, ACTIVE while
        readiness.rollback is PASS) moves apps back to the source, which
        ends in RESTORED with no RESUME. FINALIZE (ACTIVE while
        readiness.advance is PASS) stops reading and deleting from the
        source. CANCEL works before CUTOVER.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedRevision]
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [QUIESCE, CUTOVER, RESUME, ROLLBACK, FINALIZE, CANCEL]
                expectedRevision:
                  type: integer
                  minimum: 1
                  description: Must equal the migration's revision, or 409 VERSION_CONFLICT.
                transitionId:
                  type: string
                  description: Required for QUIESCE, CUTOVER, RESUME and ROLLBACK.
                quiesceRef:
                  type: string
                  description: Kept on the operation for tracing; object storage does not check it.
                expectedLocation:
                  type: string
                  enum: [TARGET]
                  description: Required for RESUME. Only the target is resumed.
                deadlineMs:
                  type: integer
                  minimum: 0
                  maximum: 3600000
                  description: How long CUTOVER, FINALIZE or CANCEL waits for apps. Default 30000.
      responses:
        "202":
          description: Accepted, not finished. Follow Location.
          headers:
            Location:
              schema: { type: string, example: /v1/operations/om-1a2b3c4d5e6f7a8b-op1 }
            Retry-After:
              schema: { type: integer, example: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [operationId, migrationId, action, status, statusUrl, revision]
                properties:
                  operationId: { type: string }
                  migrationId: { type: string }
                  action: { type: string }
                  status: { type: string, enum: [QUEUED] }
                  statusUrl: { type: string }
                  revision: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Outcome of one accepted action
      responses:
        "200":
          description: |
            RUNNING until the migration reaches the action's phase (ROLLBACK
            runs on through ROLLING_BACK). UNKNOWN when the worker could not
            confirm the outcome, for example apps that did not take a new
            route before the deadline: send ROLLBACK or wait.
          headers:
            Retry-After:
              description: Sent while the operation is still running.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [operationId, migrationId, action, status, lifecycle, revision, requestedAt]
                properties:
                  operationId: { type: string }
                  migrationId: { type: string }
                  action: { type: string }
                  command: { type: string }
                  transitionId: { type: string }
                  quiesceRef: { type: string }
                  status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN] }
                  message: { type: string }
                  lifecycle: { type: string }
                  revision: { type: integer }
                  requestedAt: { type: string, format: date-time }
                  finishedAt: { type: string, format: date-time }
                  lastError:
                    oneOf:
                      - type: "null"
                      - { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/{command}:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
      - name: command
        in: path
        required: true
        description: |
          freeze (READY), switch (FROZEN), resume (SWITCHED),
          rollback (FROZEN, SWITCHED, RESUMED, VERIFYING while
          readiness.rollback is PASS), finalize (VERIFYING while
          readiness.advance is PASS). allowedCommands lists what is accepted now.
        schema:
          type: string
          enum: [freeze, switch, resume, rollback, finalize]
    post:
      summary: Ask the worker to run a command
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandBody" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  parameters:
    MigrationID:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Repeating a request with the same key returns the first response,
        marked with the header Idempotent-Replayed: true. Reusing a key for a
        different request returns 422 IDEMPOTENCY_KEY_REUSED.
      schema: { type: string }

  responses:
    Accepted:
      description: Command recorded; the worker runs it next
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Migration" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Kind:
      type: string
      enum: [s3, gcs, seaweedfs]

    Endpoint:
      type: object
      required: [kind, bucket, ref]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        bucket: { type: string }
        region:
          type: string
          description: Bucket region. Required for s3.
          example: ap-northeast-2
        url:
          type: string
          description: S3-compatible endpoint. Required for seaweedfs.
        filer:
          type: string
          description: >-
            seaweedfs only: the filer's gRPC address, host:port. With it the
            server follows the bucket's changes as they happen; without it
            the bucket is mirrored in full every sync round.
          example: 100.64.0.7:18888
        ref:
          type: string
          description: >-
            Where the server finds credentials, never the secret itself.
            `default` uses the platform's default credentials (AWS SDK chain,
            GCP Application Default Credentials). `env:NAME` reads
            NAME_ACCESS_KEY_ID, NAME_SECRET_ACCESS_KEY and optionally
            NAME_SESSION_TOKEN for s3 and seaweedfs, or NAME_CREDENTIALS_FILE
            (a service account key file) for gcs.
          example: env:AWS_SOURCE

    RouteEndpoint:
      type: object
      required: [kind, bucket]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        bucket: { type: string }
        region: { type: string }
        url: { type: string }

    EndpointsRequest:
      type: object
      required: [source, target]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/Endpoint" }
        target: { $ref: "#/components/schemas/Endpoint" }

    CommandBody:
      type: object
      additionalProperties: false
      properties:
        cutoverId:
          type: string
          description: Ties the commands of one cutover across servers.
        deadlineMs:
          type: integer
          minimum: 0
          description: For freeze. How long the server may hold the frozen state.
        expectedVersion: { $ref: "#/components/schemas/ExpectedVersion" }

    ExpectedVersion:
      type: integer
      minimum: 0
      description: |
        Optional. The version the client last saw. If it differs from the
        current version the command is rejected with 409 VERSION_CONFLICT.

    Phase:
      type: string
      enum:
        - CREATED
        - INITIAL_SYNC
        - SYNCING
        - READY
        - FROZEN
        - SWITCHED
        - RESUMED
        - VERIFYING
        - COMPLETED
        - ROLLING_BACK
        - ROLLED_BACK
        - FAILED
        - ABORTED

    State:
      type: string
      enum: [running, waiting, succeeded, failed, unknown]
      description: unknown means the last action's outcome could not be confirmed; do not proceed automatically.

    Check:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }
        message: { type: string }

    Decision:
      type: object
      required: [result, checks]
      description: PASS only when there is at least one check and all pass. No checks is UNKNOWN.
      properties:
        result: { type: string, enum: [PASS, FAIL, UNKNOWN] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }

    Flow:
      type: object
      required: [state, backlog, lagSeconds]
      properties:
        state:
          type: string
          enum: [NOT_STARTED, INITIAL_COPY, STREAMING, DRAINING, STOPPED, OFF]
          description: |
            INITIAL_COPY copies what already exists. STREAMING follows changes
            as they happen (CDC). DRAINING applies the last changes after the
            switch. OFF means this direction is not used.
        backlog: { type: integer, description: Changes seen but not applied yet. }
        lagSeconds: { type: number }

    Migration:
      type: object
      required: [id, type, kind, lifecycle, health, phase, state, source, target, replication, readiness, lastError, version, revision, createdAt, updatedAt, allowedActions, allowedCommands]
      properties:
        id: { type: string }
        type: { type: string, enum: [object, db, cache] }
        kind: { type: string, enum: [OBJECT_STORAGE] }
        lifecycle:
          type: string
          enum: [CREATED, SYNCING, READY, QUIESCED, SWITCHED, ACTIVE, COMPLETED, ROLLING_BACK, RESTORED, CANCELLED, FAILED]
          description: |
            Common lifecycle. INITIAL_SYNC and SYNCING are SYNCING, FROZEN is
            QUIESCED, RESUMED and VERIFYING are ACTIVE, ROLLED_BACK is
            RESTORED, ABORTED is CANCELLED. ROLLING_BACK is object storage's own.
        health: { type: string, enum: [OK, FAILED, UNKNOWN] }
        phase: { $ref: "#/components/schemas/Phase" }
        state: { $ref: "#/components/schemas/State" }
        detail: { type: string, description: Server-specific sub-step for dashboards. }
        source: { $ref: "#/components/schemas/Endpoint" }
        target: { $ref: "#/components/schemas/Endpoint" }
        routing:
          type: object
          description: The route apps use now, by side.
          properties:
            generation: { type: integer }
            write: { type: string, enum: [source, target] }
            read: { type: array, items: { type: string, enum: [source, target] } }
            delete: { type: array, items: { type: string, enum: [source, target] } }
        replication:
          type: object
          required: [forward, reverse, initialCopy]
          description: >-
            How data is moving now. Forward is source to target; reverse is
            target to source after the switch. For a flow that follows a
            change feed, backlog is about how many changes wait in the feed
            and lagSeconds is the p95 time from a change in one bucket to
            the other over the last round.
          properties:
            forward: { $ref: "#/components/schemas/Flow" }
            reverse: { $ref: "#/components/schemas/Flow" }
            initialCopy:
              type: object
              properties:
                completed: { type: integer }
                total: { type: integer }
                unit: { type: string }
                bytes:
                  type: integer
                  description: Progress by size, when known.
                totalBytes: { type: integer }
        readiness:
          type: object
          required: [cutover, advance, rollback]
          properties:
            cutover:
              allOf: [{ $ref: "#/components/schemas/Decision" }]
              description: Can freeze start? Judged while syncing.
            advance:
              allOf: [{ $ref: "#/components/schemas/Decision" }]
              description: After resume, does the target match the source so the migration can finalize?
            rollback:
              allOf: [{ $ref: "#/components/schemas/Decision" }]
              description: Can the migration go back to the source now?
        allowedActions:
          type: array
          description: Actions POST .../actions would accept now. Still checked again when sent.
          items: { type: string, enum: [QUIESCE, CUTOVER, RESUME, ROLLBACK, FINALIZE, CANCEL] }
        allowedCommands:
          type: array
          description: The same, as path commands.
          items: { type: string, enum: [freeze, switch, resume, rollback, finalize, abort] }
        activeOperationId: { type: string, description: The operation still running, if any. }
        operations:
          type: array
          description: Every accepted command, oldest first.
          items: { type: object }
        pendingCommand:
          type: object
          properties:
            command: { type: string, enum: [freeze, switch, resume, rollback, finalize, abort] }
            idempotencyKey: { type: string }
            cutoverId: { type: string }
            deadlineMs: { type: integer }
            expectedVersion: { type: integer }
            requestedAt: { type: string, format: date-time }
        lastError:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/Error" }
        version: { type: integer, description: Changes on every write, progress included. }
        revision: { type: integer, description: Changes only when the phase changes or a command is accepted. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Capabilities:
      type: object
      properties:
        type: { type: string }
        kind: { type: string, enum: [OBJECT_STORAGE] }
        actions:
          type: array
          items: { type: string }
        engine: { type: string }
        sourceKinds:
          type: array
          items: { $ref: "#/components/schemas/Kind" }
        targetKinds:
          type: array
          items: { $ref: "#/components/schemas/Kind" }
        commands:
          type: array
          items: { type: string }

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: |
            INVALID_ARGUMENT (400), UNSUPPORTED_ACTION (400), UNAUTHENTICATED (401),
            NOT_FOUND (404), INVALID_PHASE (409),
            COMMAND_PENDING (409), PRECONDITION_FAILED (409), VERSION_CONFLICT (409),
            IDEMPOTENCY_KEY_REUSED (422), INTERNAL (500), ENGINE_ERROR (in lastError only)
        message: { type: string }
        retryable: { type: boolean }
