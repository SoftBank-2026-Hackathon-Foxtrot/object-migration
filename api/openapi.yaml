openapi: 3.1.0
info:
  title: Object storage migration server
  version: 0.3.0
  description: |
    The object storage server of the team's common migration API (draft 0.2,
    the contract the DB and Redis servers share). An orchestrator registers
    a plan with POST /v1/migrations, sends the nine actions to
    POST /v1/migrations/{id}/actions, and follows each one at
    GET /v1/operations/{id}. Every POST to these routes needs an
    Idempotency-Key.

    How object storage fills the common steps:
    - PREPARE checks access and that the target is clean, then starts
      following the source's changes. START_SYNC starts the full copy.
    - QUIESCE only records the cutover attempt: apps keep writing.
    - CUTOVER moves app reads to both buckets, then writes to the target,
      waiting for every app to take each new route.
    - RESUME TARGET starts copying the target's changes back to the source.
    - ROLLBACK copies the target's new objects back and moves apps to the
      source; RESUME SOURCE then confirms them there (no other change).
    - RECONCILE compares the record with what apps report and changes
      nothing outside the record.
    - FINALIZE stops reading and deleting from the source.

    With API_TOKEN set, every route except /healthz, .../routing and
    .../deletes needs Authorization: Bearer <token>. Apps call those two
    with no token.

    Responses carry the common fields and, after them, this server's own
    (phase, state, source, target, replication, routing, version,
    operations). The older routes — inline endpoints on POST
    /v1/migrations, which start at once, and the path commands — still
    work for existing tools.

paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /v1/capabilities:
    get:
      summary: What this server can migrate
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }

  /v1/preflight:
    post:
      summary: Check a migration request without changing anything
      description: >-
        Validates the request, then checks that the server can list the
        source and target and write the target. The write check puts a small
        object under `.object-migration/` in the target and deletes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointsRequest" }
      responses:
        "200":
          description: Check results. ok is false if any check failed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, checks]
                properties:
                  ok: { type: boolean }
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/Check" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/migrations:
    post:
      summary: Register a plan, or create and start a migration
      description: |
        A body with workflowId is a common-API plan: it names registered
        buckets (sourceRef, targetRef as "resource:<name>", from the file in
        OBJECT_RESOURCES), touches nothing, and answers 201 in CREATED. It
        needs an Idempotency-Key.

        A body with inline source and target endpoints creates a migration
        that starts at once and answers 202. Kept for existing tools.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/CreatePlan" }
                - { $ref: "#/components/schemas/EndpointsRequest" }
      responses:
        "201":
          description: Plan registered, in CREATED
          headers:
            Location:
              schema: { type: string, example: /v1/migrations/om-1a2b3c4d5e6f7a8b }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "202":
          description: Created from inline endpoints; the worker starts the initial copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    get:
      summary: Current state of a migration
      responses:
        "200":
          description: Migration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Abort a migration before switch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedVersion: { $ref: "#/components/schemas/ExpectedVersion" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/routing:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    get:
      summary: Where an app writes, reads and deletes now
      description: >-
        App servers ask about every second and report the generation they
        use, so a route change can wait for every live app. See
        docs/app-storage.md.
      parameters:
        - name: app
          in: query
          description: Name of the app server, unique among the app's servers.
          schema: { type: string }
        - name: applied
          in: query
          description: Route generation the app uses now; 0 before it has one.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Route. Endpoints carry no credentials.
          content:
            application/json:
              schema:
                type: object
                required: [migrationId, phase, generation, write, read, delete]
                properties:
                  migrationId: { type: string }
                  phase: { $ref: "#/components/schemas/Phase" }
                  generation: { type: integer }
                  write: { $ref: "#/components/schemas/RouteEndpoint" }
                  read:
                    type: array
                    description: In order; an object not found in one is looked up in the next.
                    items: { $ref: "#/components/schemas/RouteEndpoint" }
                  delete:
                    type: array
                    description: Every bucket that may hold a copy, in the order to delete from.
                    items: { $ref: "#/components/schemas/RouteEndpoint" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/deletes:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    post:
      summary: Record keys an app is about to delete
      description: >-
        While the route deletes from more than one bucket, an app records a
        key here before deleting it. Every copy the server makes afterwards
        removes its copy of a recorded key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              additionalProperties: false
              properties:
                keys:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, minLength: 1 }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
    post:
      summary: Accept a common-API action
      description: |
        The action must be in allowedActions and expectedRevision must equal
        the migration's revision. One command runs at a time. After an
        unknown outcome (health UNKNOWN) only RECONCILE is accepted until it
        has run. A migration allows one cutover attempt: the first QUIESCE
        sets transitionId and later held actions must repeat it.

        RECONCILE, RESUME SOURCE and FINALIZE of a restored plan finish when
        accepted (status SUCCEEDED); the others run in the worker.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "202":
          description: Accepted, not necessarily finished. Follow Location.
          headers:
            Location:
              schema: { type: string, example: /v1/operations/om-1a2b3c4d5e6f7a8b-op1 }
            Retry-After:
              schema: { type: integer, example: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [operationId, migrationId, action, status, statusUrl]
                properties:
                  operationId: { type: string }
                  migrationId: { type: string }
                  action: { $ref: "#/components/schemas/Action" }
                  status: { $ref: "#/components/schemas/OperationStatus" }
                  statusUrl: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: REVISION_CONFLICT, RESOURCE_BUSY, INVALID_STATE, UNKNOWN_STATE or IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Outcome of one accepted action
      responses:
        "200":
          description: |
            RUNNING until the migration reaches the action's result (ROLLBACK
            runs on until apps are back on the source). UNKNOWN while apps
            have not confirmed a new route before the deadline: RECONCILE,
            then ROLLBACK or wait. FAILED does not mean anything was undone;
            confirmedChanges lists the route the operation left.
          headers:
            Retry-After:
              description: Sent while the operation is still running.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [operationId, migrationId, action, status, error, confirmedChanges]
                properties:
                  operationId: { type: string }
                  migrationId: { type: string }
                  action: { $ref: "#/components/schemas/Action" }
                  status: { $ref: "#/components/schemas/OperationStatus" }
                  error:
                    oneOf:
                      - type: "null"
                      - { $ref: "#/components/schemas/Error" }
                  confirmedChanges: { type: array, items: { type: string } }
                  transitionId: { type: [string, "null"] }
                  requestedAt: { type: string, format: date-time }
                  finishedAt: { type: [string, "null"], format: date-time }
                  lifecycle: { $ref: "#/components/schemas/Lifecycle" }
                  revision: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/migrations/{id}/{command}:
    parameters:
      - $ref: "#/components/parameters/MigrationID"
      - name: command
        in: path
        required: true
        description: |
          freeze (READY), switch (FROZEN), resume (SWITCHED),
          rollback (FROZEN, SWITCHED, RESUMED, VERIFYING while
          readiness.rollback is PASS), finalize (VERIFYING while
          readiness.advance is PASS). allowedCommands lists what is accepted now.
        schema:
          type: string
          enum: [freeze, switch, resume, rollback, finalize]
    post:
      summary: Ask the worker to run a command
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandBody" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  parameters:
    MigrationID:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Repeating a request with the same key returns the first response,
        marked with the header Idempotent-Replayed: true. Reusing a key for a
        different request returns 409 IDEMPOTENCY_CONFLICT.
      schema: { type: string }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: As IdempotencyKey; required.
      schema: { type: string }

  responses:
    Accepted:
      description: Command recorded; the worker runs it next
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Migration" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Kind:
      type: string
      enum: [s3, gcs, seaweedfs]

    Endpoint:
      type: object
      required: [kind, bucket, ref]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        bucket: { type: string }
        region:
          type: string
          description: Bucket region. Required for s3.
          example: ap-northeast-2
        url:
          type: string
          description: S3-compatible endpoint. Required for seaweedfs.
        filer:
          type: string
          description: >-
            seaweedfs only: the filer's gRPC address, host:port. With it the
            server follows the bucket's changes as they happen; without it
            the bucket is mirrored in full every sync round.
          example: 100.64.0.7:18888
        ref:
          type: string
          description: >-
            Where the server finds credentials, never the secret itself.
            `default` uses the platform's default credentials (AWS SDK chain,
            GCP Application Default Credentials). `env:NAME` reads
            NAME_ACCESS_KEY_ID, NAME_SECRET_ACCESS_KEY and optionally
            NAME_SESSION_TOKEN for s3 and seaweedfs, or NAME_CREDENTIALS_FILE
            (a service account key file) for gcs.
          example: env:AWS_SOURCE

    RouteEndpoint:
      type: object
      required: [kind, bucket]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        bucket: { type: string }
        region: { type: string }
        url: { type: string }

    EndpointsRequest:
      type: object
      required: [source, target]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/Endpoint" }
        target: { $ref: "#/components/schemas/Endpoint" }

    CommandBody:
      type: object
      additionalProperties: false
      properties:
        cutoverId:
          type: string
          description: Ties the commands of one cutover across servers.
        deadlineMs:
          type: integer
          minimum: 0
          description: For freeze. How long the server may hold the frozen state.
        expectedVersion: { $ref: "#/components/schemas/ExpectedVersion" }

    ExpectedVersion:
      type: integer
      minimum: 0
      description: |
        Optional. The version the client last saw. If it differs from the
        current version the command is rejected with 409 VERSION_CONFLICT.

    Phase:
      type: string
      enum:
        - CREATED
        - PREPARED
        - INITIAL_SYNC
        - SYNCING
        - READY
        - FROZEN
        - SWITCHED
        - RESUMED
        - VERIFYING
        - COMPLETED
        - ROLLING_BACK
        - ROLLED_BACK
        - FAILED
        - ABORTED

    State:
      type: string
      enum: [running, waiting, succeeded, failed, unknown]
      description: unknown means the last action's outcome could not be confirmed; do not proceed automatically.

    Check:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }
        message: { type: string }

    Decision:
      type: object
      required: [result, checks]
      description: PASS only when there is at least one check and all pass. No checks is UNKNOWN.
      properties:
        result: { type: string, enum: [PASS, FAIL, UNKNOWN] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }

    Flow:
      type: object
      required: [state, backlog, lagSeconds]
      properties:
        state:
          type: string
          enum: [NOT_STARTED, INITIAL_COPY, STREAMING, DRAINING, STOPPED, OFF]
          description: |
            INITIAL_COPY copies what already exists. STREAMING follows changes
            as they happen (CDC). DRAINING applies the last changes after the
            switch. OFF means this direction is not used.
        backlog: { type: integer, description: Changes seen but not applied yet. }
        lagSeconds: { type: number }

    Migration:
      type: object
      description: |
        The common status first, then this server's own fields. readiness
        and checks follow the common form; details.object.readiness keeps
        every check behind them.
      required: [migrationId, workflowId, resourceId, kind, revision, lifecycle, health, phase, activeOperationId, transitionId, transitionState, topologyRevision, allowedActions, observed, readiness, rollback, progress, checks]
      properties:
        migrationId: { type: string }
        workflowId: { type: string, description: Empty for migrations created from inline endpoints. }
        resourceId: { type: string }
        kind: { type: string, enum: [OBJECT_STORAGE] }
        revision: { type: integer, description: Changes when the phase changes or an action is accepted, not on progress. }
        lifecycle: { $ref: "#/components/schemas/Lifecycle" }
        health: { type: string, enum: [OK, FAILED, UNKNOWN] }
        phase: { $ref: "#/components/schemas/Phase" }
        activeOperationId: { type: [string, "null"] }
        transitionId: { type: [string, "null"] }
        transitionState: { type: string, enum: [NONE, OPEN, CLOSED] }
        topologyRevision: { type: integer, description: The route generation apps follow. }
        allowedActions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
        observed:
          type: object
          required: [observedAt, route, businessWriteAccess, targetWritesPossible]
          properties:
            observedAt: { type: string, format: date-time }
            route: { type: string, enum: [SOURCE, TARGET, MIXED], description: MIXED while apps read both buckets. }
            businessWriteAccess: { type: string, enum: [SOURCE_ONLY, TARGET_ONLY] }
            targetWritesPossible: { type: boolean, description: True from the moment CUTOVER is accepted, and never false again. }
        readiness:
          type: object
          required: [cutover, resume, rollback, advance]
          properties:
            cutover: { $ref: "#/components/schemas/CommonDecision" }
            resume: { $ref: "#/components/schemas/CommonDecision" }
            rollback: { $ref: "#/components/schemas/CommonDecision" }
            advance:
              allOf: [{ $ref: "#/components/schemas/CommonDecision" }]
              description: "FAIL when an ADVANCE check fails, else UNKNOWN: WORKLOAD_RUNNING and BUSINESS_PROBE are the orchestrator's evidence."
        rollback:
          type: object
          required: [method, reasons]
          properties:
            method: { type: string, enum: [DIRECT, REVERSE_SYNC, UNAVAILABLE] }
            reasons: { type: array, items: { type: string } }
        progress:
          type: object
          required: [completed, total, unit]
          properties:
            completed: { type: [integer, "null"] }
            total: { type: [integer, "null"] }
            unit: { type: string, enum: [objects] }
        checks:
          type: array
          description: |
            QUIESCE_COMPLETE, CUTOVER_SAFE, RESUME_SAFE, ROLLBACK_SAFE, and the
            ADVANCE checks RESOURCE_HEALTH, ROUTE_MATCH, WORKLOAD_RUNNING,
            BUSINESS_PROBE, FOLLOWUP_COMPLETE (target matches source while
            copying back) and STABILITY_WINDOW (30 seconds on the target).
          items: { $ref: "#/components/schemas/CommonCheck" }
        details:
          type: object
          properties:
            object:
              type: object
              properties:
                readiness:
                  type: object
                  properties:
                    cutover: { $ref: "#/components/schemas/Decision" }
                    advance: { $ref: "#/components/schemas/Decision" }
                    rollback: { $ref: "#/components/schemas/Decision" }
                appsLive: { type: integer, description: Apps that asked for their route within APP_TTL. }
        id: { type: string, description: Same as migrationId. }
        type: { type: string, enum: [object] }
        state: { $ref: "#/components/schemas/State" }
        detail: { type: string }
        source: { $ref: "#/components/schemas/Endpoint" }
        target: { $ref: "#/components/schemas/Endpoint" }
        routing:
          type: object
          description: The route apps use now, by side.
          properties:
            generation: { type: integer }
            write: { type: string, enum: [source, target] }
            read: { type: array, items: { type: string, enum: [source, target] } }
            delete: { type: array, items: { type: string, enum: [source, target] } }
        replication:
          type: object
          description: >-
            How data is moving now. Forward is source to target; reverse is
            target to source after resume.
          properties:
            forward: { $ref: "#/components/schemas/Flow" }
            reverse: { $ref: "#/components/schemas/Flow" }
            initialCopy:
              type: object
              properties:
                completed: { type: integer }
                total: { type: integer }
                unit: { type: string }
                bytes: { type: integer }
                totalBytes: { type: integer }
        allowedCommands:
          type: array
          description: allowedActions as path commands.
          items: { type: string, enum: [prepare, start_sync, freeze, switch, resume, rollback, finalize, abort] }
        operations:
          type: array
          description: Every accepted action, oldest first.
          items: { type: object }
        plan: { type: object, description: The common-API create request, when there was one. }
        lastError:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/ServerError" }
        version: { type: integer, description: Changes on every write, progress included. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Lifecycle:
      type: string
      enum: [CREATED, PREPARED, SYNCING, READY, QUIESCED, SWITCHED, ACTIVE, ROLLED_BACK_HELD, RESTORED, CANCELLED, COMPLETED, FAILED]
      description: While a rollback runs, the lifecycle stays where it started, with activeOperationId set.

    Action:
      type: string
      enum: [PREPARE, START_SYNC, QUIESCE, CUTOVER, RESUME, ROLLBACK, CANCEL, RECONCILE, FINALIZE]

    OperationStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, UNKNOWN]

    ActionRequest:
      type: object
      required: [action, expectedRevision]
      additionalProperties: false
      properties:
        action: { $ref: "#/components/schemas/Action" }
        expectedRevision: { type: integer, minimum: 0 }
        transitionId:
          type: string
          description: Required for QUIESCE, CUTOVER, RESUME and ROLLBACK; refused for the rest.
        quiesceRef:
          type: string
          description: Required with transitionId. Kept on the operation; not checked, since apps keep writing.
        expectedLocation:
          type: string
          enum: [SOURCE, TARGET]
          description: Required for RESUME. TARGET after CUTOVER, SOURCE after ROLLBACK.
        deadlineMs:
          type: integer
          minimum: 0
          maximum: 3600000
          description: This server's own. How long CUTOVER, FINALIZE or CANCEL waits for apps. Default CONFIRM_TIMEOUT.

    CreatePlan:
      type: object
      required: [workflowId, resourceId, kind, profile, sourceRef, targetRef, workloadScopeRef, bindingRef, policy]
      additionalProperties: false
      properties:
        workflowId: { type: string }
        resourceId: { type: string }
        kind: { type: string, enum: [OBJECT_STORAGE] }
        profile: { type: string, enum: [object-copy-route-v1] }
        sourceRef: { type: string, example: "resource:aws-receipts" }
        targetRef: { type: string, example: "resource:gcp-receipts" }
        workloadScopeRef: { type: string }
        bindingRef: { type: string }
        policy:
          type: object
          required: [rollbackMode, maxQuiesceSeconds]
          properties:
            rollbackMode: { type: string, enum: [REVERSE_REQUIRED] }
            maxQuiesceSeconds: { type: integer, minimum: 1, description: Kept; object storage does not pause apps. }
        replicationRef: { type: "null" }

    CommonDecision:
      type: object
      required: [result, reasons]
      properties:
        result: { type: string, enum: [PASS, FAIL, UNKNOWN] }
        reasons: { type: array, items: { type: string } }

    CommonCheck:
      type: object
      required: [code, stage, required, decision, evidenceRef, observedAt, validUntil, transitionId, topologyRevision]
      properties:
        code: { type: string }
        stage: { type: string, enum: [QUIESCE, CUTOVER, RESUME, ADVANCE, ROLLBACK] }
        required: { type: boolean }
        decision: { $ref: "#/components/schemas/CommonDecision" }
        evidenceRef: { type: [string, "null"], description: Set when the decision is PASS. }
        observedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time, description: observedAt plus 30 seconds. }
        transitionId: { type: [string, "null"] }
        topologyRevision: { type: integer }

    ServerError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }

    Capabilities:
      type: object
      required: [apiVersion, profiles]
      properties:
        apiVersion: { type: string, const: v1 }
        profiles:
          type: array
          items:
            type: object
            required: [kind, profile, sourceConditions, targetConditions, actions, rollbackModes, constraints]
            properties:
              kind: { type: string, enum: [OBJECT_STORAGE] }
              profile: { type: string }
              sourceConditions: { type: array, items: { type: string } }
              targetConditions: { type: array, items: { type: string } }
              actions: { type: array, items: { $ref: "#/components/schemas/Action" } }
              rollbackModes: { type: array, items: { type: string } }
              constraints: { type: array, items: { type: string } }
        engine: { type: string }
        sourceKinds:
          type: array
          items: { $ref: "#/components/schemas/Kind" }
        targetKinds:
          type: array
          items: { $ref: "#/components/schemas/Kind" }
        directions: { type: array, items: { type: object } }

    Error:
      type: object
      required: [code, message, operationId, blockers]
      properties:
        code:
          type: string
          description: |
            INVALID_REQUEST (400), UNAUTHENTICATED (401), NOT_FOUND (404),
            REVISION_CONFLICT, RESOURCE_BUSY, INVALID_STATE, UNKNOWN_STATE,
            IDEMPOTENCY_CONFLICT (409), UNSUPPORTED_PROFILE,
            PRECONDITION_FAILED (422), INTERNAL (500)
        message: { type: string }
        operationId: { type: [string, "null"] }
        blockers: { type: array, items: { type: string } }
        retryable:
          type: boolean
          description: This server's own. A retryable answer is not replayed for the same Idempotency-Key.
